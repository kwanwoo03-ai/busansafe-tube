const ytId=s=>{s=(s||"").trim();const m=s.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(s)?s:""};
const save=()=>{D.up=today();try{localStorage.setItem(KEY,JSON.stringify(D));return"✅ 이 기기에 저장했어요."}catch(e){return"용량이 커서 저장하지 못했어요. 아래 파일로 저장을 사용해 주세요."}};
const build=st=>{const code=$("#src").textContent.replace(/const STUDENT=(?:true|false),EMB="(?:[^"\\]|\\.)*",EID="[^"]*",VER/,()=>"const STUDENT="+st+",EMB="+JSON.stringify(JSON.stringify(D)).replace(/</g,"\\u003c")+",EID="+JSON.stringify(st?"":Date.now().toString(36))+",VER");return'<!DOCTYPE html>\n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1e4fa3"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BusanSafe"><title>'+E(D.name+" "+D.sub)+'</title><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("scPref")||"{}").th||"light"}catch(e){document.documentElement.dataset.theme="light"}<\/script>'+document.querySelector("style").outerHTML+'</head><body>'+SHELL+'<script id="src">'+code+'<\/script></body></html>'};
const dl=st=>{D.up=today();render();const h=build(st),n=(st?"이용자용":"관리자용")+"_"+D.name+D.sub+".html";try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download=n;document.body.appendChild(a);a.click();a.remove()}catch(e){}$("#cd").value=h;say("✅ 파일 저장을 시도했어요 ("+n+"). 내려받아지지 않으면 아래 칸 전체를 복사해 메모장에 .html로 저장하세요(UTF-8).")};

const dropIfUnused=id=>{const u=x=>x.c===id||(x.cx||[]).includes(id);if(id>=8&&!D.extra.some(u)&&!Object.values(D.ov).some(u))delete D.cn[id]};
function menuEd(){const M=D.menu,hid=Object.keys(D.cn).map(Number).filter(id=>!M.some(g=>g.ids.includes(id)));
 $("#me").innerHTML=M.map((g,gi)=>`<div class="mg"><div class="ar"><input class="gi" data-gn="${gi}" value="${E(g.g)}"><button class="b" data-m="gup" data-g="${gi}">↑</button><button class="b" data-m="gdn" data-g="${gi}">↓</button><button class="b" data-m="grm" data-g="${gi}">묶음 제거</button></div>`+g.ids.map((id,ci)=>`<div class="ar"><input data-cn="${id}" value="${E(CN(id))}"><button class="b" data-m="cup" data-g="${gi}" data-c="${ci}">↑</button><button class="b" data-m="cdn" data-g="${gi}" data-c="${ci}">↓</button><select data-m="cmv" data-g="${gi}" data-c="${ci}"><option value="">다른 묶음으로…</option>${M.map((x,k)=>k===gi?"":`<option value="${k}">${E(x.g)}</option>`).join("")}</select><button class="b" data-m="crm" data-g="${gi}" data-c="${ci}">메뉴에서 제거</button></div>`).join("")+`<div class="ar"><input id="nc${gi}" placeholder="이 묶음에 새 항목 이름"><button class="b" data-m="cadd" data-g="${gi}">+ 항목 추가</button></div></div>`).join("")+`<div class="ar"><input id="ng" placeholder="새 묶음 이름 (예: 우리 학교 자료)"><button class="b" data-m="gadd">+ 묶음 추가</button></div>`+(hid.length?`<div class="ar">제거한 항목 복원: <select id="rs">${hid.map(id=>`<option value="${id}">${E(CN(id))}</option>`).join("")}</select> → <select id="rg">${M.map((x,k)=>`<option value="${k}">${E(x.g)}</option>`).join("")}</select><button class="b" data-m="rest">복원</button></div>`:"")}
function menuAct(d){const gi=+d.g,ci=+d.c,M=D.menu,m=d.m,a=M[gi]&&M[gi].ids;
 if(m==="gup"&&gi>0)[M[gi-1],M[gi]]=[M[gi],M[gi-1]];
 else if(m==="gdn"&&gi<M.length-1)[M[gi+1],M[gi]]=[M[gi],M[gi+1]];
 else if(m==="grm"){if(!confirm("이 묶음을 메뉴에서 없앨까요? 안의 자료는 '전체 자료'에 그대로 남아요."))return;M.splice(gi,1)[0].ids.forEach(dropIfUnused)}
 else if(m==="cup"&&ci>0)[a[ci-1],a[ci]]=[a[ci],a[ci-1]];
 else if(m==="cdn"&&ci<a.length-1)[a[ci+1],a[ci]]=[a[ci],a[ci+1]];
 else if(m==="crm"){dropIfUnused(a.splice(ci,1)[0])}
 else if(m==="cadd"){const v=$("#nc"+gi).value.trim();if(!v)return;const id=Math.max(...Object.keys(D.cn).map(Number),7)+1;D.cn[id]=v;a.push(id)}
 else if(m==="gadd"){const v=$("#ng").value.trim();if(!v)return;M.push({g:v,ids:[]})}
 else if(m==="rest"){const id=+$("#rs").value;M[+$("#rg").value||0].ids.push(id)}
 menuEd();render()}
function exl(){$("#exl").innerHTML=D.extra.map((e,i)=>`<div class="ar">${E(e.t)} <span style="color:#94a3b8">(${CN(e.c)}${e.n?" · #"+e.n:""})</span><button class="b" data-del="${i}">삭제</button></div>`).join("")||'<span style="color:#94a3b8;font-size:12px">등록한 자료가 없어요.</span>'}
function admin(){const P=$("#adminP");P.hidden=!P.hidden;if(P.hidden)return;
 P.innerHTML=`<h3>🛠 관리자</h3><div class="ab"><b>엑셀로 한꺼번에 불러오기</b> <span style="font-size:11.5px;color:#94a3b8">(안전교육자료_주소입력용.xlsx 또는 CSV · 채운 줄만 반영해요)</span><div class="ar"><input type="file" id="xf" accept=".xlsx,.csv"></div><div id="xr"></div></div><div class="ab"><b>왼쪽 메뉴 편집</b> <span style="font-size:11.5px;color:#94a3b8">(이름 바꾸기·순서 바꾸기·추가·제거 · 제거해도 자료는 '전체 자료'에 남아요)</span><div id="me"></div></div><div class="ab"><b>사이트 이름·색</b><div class="ar"><input id="sN" value="${E(D.name)}"><input id="sS" value="${E(D.sub)}"><input id="sC" type="color" value="${D.color}" style="max-width:50px"><input id="rp" placeholder="오류 신고 연결 (메일 주소 또는 신고 폼 주소)" value="${E(D.report||"")}"><label style="font-size:13px;white-space:nowrap"><input type="checkbox" id="sL" ${D.logo?"checked":""}> 부산교육청 로고 표시</label><button class="b" data-a="cfg">적용</button></div></div>
 <div class="ab"><b>자료 추가 (부산 자체 자료, 새로 올라온 시스템 자료)</b><div class="ar"><input id="aT" placeholder="제목"><select id="aC">${Object.keys(D.cn).map(id=>`<option value="${id}">${E(D.cn[id])}</option>`).join("")}</select><select id="aO"><option value="">제작기관</option>${ORGS.map(o=>`<option>${o}</option>`).join("")}</select><input id="aY" placeholder="연도" style="max-width:80px;flex:0"></div>
 <div class="ar">학교급 ${LVN.map((n,i)=>`<label><input type="checkbox" class="aL" value="${1<<i}"> ${n}</label>`).join(" ")}</div>
 <div class="ar"><input id="aN" placeholder="시스템 자료번호 (선택)"><input id="aU" placeholder="자료 페이지 주소 (비우면 시스템 상세 페이지)"><input id="aYT" placeholder="유튜브 주소 (선택)"></div>
 <div class="ar"><input id="aH" placeholder="썸네일 이미지 주소 (선택)"><input id="aV" placeholder="영상 mp4 주소 (선택)"></div><div class="ar"><input id="aD" placeholder="설명 (선택)"><button class="b" data-a="add">+ 추가</button></div></div>
 <div class="ab"><b>시스템 자료에 썸네일·영상 주소 붙이기</b> <span style="font-size:11.5px;color:#94a3b8">(번호를 몰라도 돼요. 각 카드의 ✏️ 버튼으로 바로 붙일 수 있어요)</span> <span style="font-size:11.5px;color:#94a3b8">(썸네일 없이 영상 mp4 주소만 넣어도 첫 장면이 미리보기로 나와요)</span><div class="ar"><input id="oN" placeholder="자료번호 (카드의 #번호)"><input id="oH" placeholder="썸네일 주소"><input id="oV" placeholder="영상 mp4 주소"><button class="b" data-a="ov">적용</button></div></div>
 <div class="ab"><b>등록한 자료</b><div id="exl"></div></div><div class="ar"><button class="b" data-a="sv">이 기기에 저장</button><button class="b on" data-a="fa">관리자용 파일로 저장</button><button class="b" data-a="fs">이용자용 파일로 저장</button></div><div id="fb"></div><textarea id="cd" rows="2" placeholder="파일 저장이 안 되면 여기에 내용이 나와요"></textarea>`;exl();menuEd();
 $("#xf").onchange=async e=>{const f=e.target.files[0];if(!f)return;const R=$("#xr");R.textContent="읽는 중…";try{const sh=/\.csv$/i.test(f.name)?{"자료목록":csv(await f.text())}:await xlsxRead(await f.arrayBuffer()),P=plan(sh),c=P.c;
  R.innerHTML=`<p style="margin:8px 0">읽은 결과: 시스템 자료 <b>${P.n}건</b> (썸네일 ${c.th} · 영상 mp4 ${c.v} · 유튜브 ${c.yt} · 설명 ${c.d})${P.e?` · 새 자료 <b>${P.e}건</b>`:""} · 확인할 항목 ${P.sk.length}건</p>${P.sk.length?`<div style="font-size:12px;color:#fbbf24;max-height:140px;overflow:auto;margin-bottom:6px">${P.sk.slice(0,30).map(s=>"⚠ "+E(s)).join("<br>")}${P.sk.length>30?"<br>…":""}</div>`:""}${P.n+P.e?`<button class="b on" id="xa">적용하기</button>`:""}`;
  if($("#xa"))$("#xa").onclick=()=>{applyPlan(P);R.innerHTML=`<div class="fbx">✅ 반영했어요. ${save().replace("✅ ","")} 아래 '관리자용 파일로 저장'·'이용자용 파일로 저장'으로 파일에 남겨 주세요.</div>`}}catch(x){R.textContent="파일을 읽지 못했어요 ("+x.message+")"}}}
document.addEventListener("click",e=>{const t=e.target;
 if(t.closest(".mbx")&&!t.classList.contains("x")&&!t.closest("a"))return;
 if(t.id==="md"||t.classList.contains("x"))return closeM();
 const p=t.closest("[data-p]");if(p){e.stopPropagation();return play(cur[+p.dataset.p])}
 if(t.dataset.m&&t.tagName==="BUTTON")return menuAct(t.dataset);
 const fb=t.closest("[data-f]");if(fb){e.stopPropagation();const it=cur[+fb.dataset.f],f=LS.get("scFav",[]),k=kid(it),ix=f.indexOf(k);ix>=0?f.splice(ix,1):f.push(k);LS.set("scFav",f);return render()}
 const rb=t.closest("[data-r]");if(rb){e.stopPropagation();return reportItem(cur[+rb.dataset.r])}
 if(t.id==="fbt"){S.fo=S.fo?0:1;return render()}
 if(t.dataset.k==="reset"){S.sp="";S.lv=0;S.yr="";S.tp=-1;S.o="";S.nold=0;S.pg=60;return render()}
 if(t.id==="selb"){selMode=!selMode;if(!selMode)SEL.clear();return render()}
 if(t.dataset.b)return bAct(t.dataset.b);
 const ed=t.closest("[data-e]");if(ed){e.stopPropagation();return editItem(cur[+ed.dataset.e])}
 const c=t.closest(".cd");if(c&&selMode){const it=cur[+c.dataset.i],k=kid(it);SEL.has(k)?SEL.delete(k):SEL.add(k);c.classList.toggle("sel",SEL.has(k));const ck=c.querySelector(".ck");if(ck)ck.textContent=SEL.has(k)?"☑":"☐";const sc=$("#scnt");if(sc)sc.textContent=SEL.size+"건 선택";return}
 if(c){const it=cur[+c.dataset.i];pushRecent(it);return void window.open(link(it),"_blank","noopener")}
 const s=t.closest(".si");if(s){S.c=+s.dataset.c;S.sp=s.dataset.sp||"";S.pg=60;$("#sb").classList.remove("open");return render()}
 const h=t.closest(".ch");if(h){const k=h.dataset.k,v=h.dataset.v;if(k==="sp"){S.sp=S.sp===v?"":v;S.c=-1}else if(k==="nold")S.nold=S.nold?0:1;else S[k]=k==="yr"?v:+v;S.pg=60;return render()}
 if(t.id==="mo"){S.pg+=60;return render()}if(t.id==="mb")return $("#sb").classList.toggle("open");if(t.id==="adm")return admin();
 if(t.dataset.del!==undefined){D.extra.splice(+t.dataset.del,1);exl();return render()}
 const a=t.dataset.a;if(!a)return;
 if(a==="cfg"){D.name=$("#sN").value||"BusanSafe";D.logo=$("#sL").checked;D.sub=$("#sS").value;D.color=$("#sC").value;D.report=$("#rp").value.trim();render();say("✅ 적용했어요.")}
 else if(a==="add"){const T=$("#aT").value.trim();if(!T)return say("제목을 적어 주세요.");const it={t:T,c:+$("#aC").value,o:$("#aO").value,y:+$("#aY").value||0,l:[...document.querySelectorAll(".aL:checked")].reduce((m,x)=>m|+x.value,0)},n=+$("#aN").value;if(n)it.n=n;["aU:u","aH:th","aV:v","aD:d"].forEach(p=>{const[i,k]=p.split(":"),v=$("#"+i).value.trim();if(v)it[k]=v});const y=ytId($("#aYT").value);if(y)it.yt=y;D.extra.push(it);exl();render();say("✅ 자료를 추가했어요. 저장을 눌러 주세요.")}
 else if(a==="ov"){const n=+$("#oN").value;if(!BASE.some(r=>r[0]===n))return say("받은 목록에 없는 자료번호예요. 위의 '자료 추가'를 사용해 주세요.");const o=Object.assign({},D.ov[n]),h=$("#oH").value.trim(),v=$("#oV").value.trim();if(h)o.th=h;if(v)o.v=v;D.ov[n]=o;render();say("✅ #"+n+" 자료에 적용했어요. 저장을 눌러 주세요.")}
 else if(a==="sv")say(save());else if(a==="fa")dl(false);else if(a==="fs")dl(true)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")return closeM();const t=e.target;if((e.key==="Enter"||e.key===" ")&&t.classList&&(t.classList.contains("cd")||t.classList.contains("si"))){e.preventDefault();t.click()}});
$("#thm").onclick=()=>{PR.th=PR.th==="dark"?"light":"dark";LS.set("scPref",PR);applyPr()};
$("#fsm").onclick=()=>{PR.z=Math.max(0,(PR.z==null?1:PR.z)-1);LS.set("scPref",PR);applyPr()};$("#fsp").onclick=()=>{PR.z=Math.min(3,(PR.z==null?1:PR.z)+1);LS.set("scPref",PR);applyPr()};
$("#q").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{S.q=e.target.value.trim().toLowerCase();S.pg=60;render()},180)};
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.gn!==undefined){D.menu[+t.dataset.gn].g=t.value;render()}if(t.dataset.cn!==undefined){D.cn[+t.dataset.cn]=t.value;render()}});
document.addEventListener("change",e=>{if(e.target.dataset.m==="cmv"&&e.target.value!==""){const t=e.target,to=+t.value,a=D.menu[+t.dataset.g].ids;D.menu[to].ids.push(a.splice(+t.dataset.c,1)[0]);menuEd();render();return}if(e.target.id==="org"){S.o=e.target.value;S.pg=60;render()}if(e.target.id==="so"){S.so=e.target.value;render()}});
$("#adm").hidden=STUDENT;
render();
